[package]
name = "types"
rust-version = "1.85"
version = "0.1.0"
edition = "2024"
description = "Request, response and data types shared by the Xenon server and clients."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }
sqlx = { version = "0.9", default-features = false, features = ["derive"], optional = true }
ts-rs = { version = "12.0", features = ["uuid-impl"], optional = true }

[features]
sqlx = ["dep:sqlx"]
ts_bindings = ["dep:ts-rs"]
links = []
push = []
rtc = []
