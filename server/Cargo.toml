[package]
name = "xenon"
rust-version = "1.85"
version = "0.7.5"
edition = "2024"
authors = ["Austin Lanphear <austin@soltek.games>"]
description = "Private self hostable chat application that uses SQLite for database operations."
readme = "README.md"
repository = "https://github.com/TheChiefu/xenon"
publish = false

[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
axum = { version = "0.8", features = ["macros", "ws", "multipart"] }
base64 = "0.22"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"]}
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "uuid", "migrate", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "fs", "io-util", "io-std"] }
uuid = { version = "1", features = ["v7", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3.33"
toml = "1.1.4"
tokio-util = { version = "0.7.19", features = ["io"] }
infer = "0.22.0"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls", "webpki-roots"], optional = true }
url = "2"
web-push-native = { version = "0.5", optional = true }
ts-rs = { version = "12.0", features = ["uuid-impl"], optional = true }
webrtc = { version = "0.21", optional = true }
rtc = { version = "0.21", default-features = false, optional = true }
async-trait = { version = "0.1", optional = true }

[features]
ts_bindings = ["dep:ts-rs"] # Requires rust version 1.88.0
push = ["dep:reqwest", "dep:web-push-native"]
links = ["dep:reqwest"]
rtc = ["dep:webrtc", "dep:rtc", "dep:async-trait"]
full = ["push", "links", "rtc"]
