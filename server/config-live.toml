  GNU nano 7.2                                                                           config.toml                                                                                    
version = 1

[info]
name = "Eternus"
kind = "Release"
description = "The Chiefu's Personal Server"

[bind]
ip = "127.0.0.1"
port = 3000
allowed_origins = []
cors_max_age = 3600

[storage]
files = "files"

[database]
path = "chat.db"
max_connections = 5
min_connections = 0
acquire_timeout_seconds = 30
idle_timeout_seconds = 600
busy_timeout_seconds = 5
broadcast_retries = 2
broadcast_retry_delay_ms = 100

[logging]
file = "xenon.log"
level = "info"

[session]
lifetime_days = 30
renew_after_days_elapsed = 1
registration_code_required = true

[push]
subject = "https://chat.eternus.app"
ttl = 86400

[xbox]
client_id = "ID"
client_secret = "SERCRET"
redirect_uri = "https://chat.eternus.app/xbox/redirect"
game_mappings = "games.json"
poll_interval_seconds = 60

[limits]
username_min = 2
username_max = 32
display_name_min = 1
display_name_max = 64
profile_description_max = 2000
room_name_max = 128
room_read_max = 100
message_body_max = 8000
password_min = 8
password_max = 128
file_bytes_max = "25MiB"
attachments_per_message_max = 10
message_page = 200
room_page = 200
users_page = 25
users_lookup = 500
message_buffer = 32
request_timeout_seconds = 30
